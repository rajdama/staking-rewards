name: contracts

on:
  push:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: contracts

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Versions
        run: forge --version

      - name: Format check
        continue-on-error: true
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vv

      - name: Gas report
        run: forge test --gas-report --no-match-contract "Invariant|DeployScript"

      - name: Coverage
        run: forge coverage --report summary --report lcov --no-match-coverage "(script|test)" | tee coverage.txt

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            contracts/coverage.txt
            contracts/lcov.info

  slither:
    name: Slither security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Slither
        run: pipx install slither-analyzer

      - name: Run Slither
        run: |
          slither . --filter-paths "lib/|test/|script/" --checklist > slither-report.md || true
          slither . --filter-paths "lib/|test/|script/" --fail-medium

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: contracts/slither-report.md
