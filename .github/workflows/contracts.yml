name: contracts

on:
  push:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: contracts

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Versions
        run: forge --version

      - name: Format check
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vv

      - name: Deploy and renew on a local chain
        env:
          # Anvil's well-known first test key. Never use it on a real network.
          PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
        run: |
          anvil --silent &
          sleep 2
          forge script script/Deploy.s.sol --rpc-url http://127.0.0.1:8545 --broadcast
          cat deployments/31337.json
          STAKING=$(jq -r .staking deployments/31337.json)
          cast call "$STAKING" "rewardRate()(uint256)" --rpc-url http://127.0.0.1:8545
          cast rpc evm_increaseTime 604800 --rpc-url http://127.0.0.1:8545 && cast rpc evm_mine --rpc-url http://127.0.0.1:8545
          forge script script/Renew.s.sol --rpc-url http://127.0.0.1:8545 --broadcast
          cast call "$STAKING" "finishAt()(uint256)" --rpc-url http://127.0.0.1:8545

      - name: Gas report
        run: forge test --gas-report --no-match-contract "Invariant|DeployScript"

      - name: Coverage
        run: forge coverage --report summary --report lcov --no-match-coverage "(script|test)" | tee coverage.txt

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            contracts/coverage.txt
            contracts/lcov.info

  slither:
    name: Slither security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Slither
        run: pipx install slither-analyzer

      - name: Run Slither
        run: |
          slither . --filter-paths "lib/|test/|script/" --checklist > slither-report.md || true
          slither . --filter-paths "lib/|test/|script/" --fail-medium

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: contracts/slither-report.md
