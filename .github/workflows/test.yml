name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  foundry:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: |
          [ -d lib/forge-std ] || git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
          [ -d lib/openzeppelin-contracts ] || git clone --depth 1 --branch v5.1.0 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts

      - name: Versions
        run: forge --version

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vv

      - name: Gas report
        run: forge test --gas-report

      - name: Coverage
        continue-on-error: true
        run: forge coverage --report summary --no-match-coverage "(script|test)"
