name: indexer

on:
  push:
    paths: ["indexer/**", ".github/workflows/indexer.yml"]
  pull_request:
    paths: ["indexer/**"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: indexer

jobs:
  test:
    name: Vet, test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: staking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: indexer/go.mod
          cache: false

      - name: Resolve dependencies
        run: go mod tidy

      - name: Commit go.sum if it changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- go.mod go.sum || [ -n "$(git status --porcelain -- go.sum)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add go.mod go.sum
            git commit -m "indexer: update go.mod and go.sum"
            git push
          fi

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/staking_test?sslmode=disable
        run: go test -race -count=1 -cover ./...

      - name: Build
        run: go build -o /tmp/indexer ./cmd/indexer
